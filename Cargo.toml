[package]
name = "libxslt"
version = "0.1.5"
edition = "2021"
authors = ["Deyan Ginev <deyan.ginev@gmail.com>"]
description = "A Rust wrapper for libxslt - The XSLT C library for GNOME"
repository = "https://github.com/KWARC/rust-libxslt"
documentation = "http://kwarc.github.io/rust-libxslt/libxslt/index.html"
readme = "README.md"
license = "MIT"

build = "build.rs"

[dependencies]
libc = "0.2"
libxml = "0.3.0"

[build-dependencies]
pkg-config = "0.3.2"

# Windows/MSVC resolves libxslt through vcpkg (same pattern as rust-libxml):
# `vcpkg install libxslt:<triplet>` + VCPKG_ROOT/VCPKGRS_TRIPLET env vars.
[target.'cfg(all(target_family = "windows", target_env = "msvc"))'.build-dependencies]
vcpkg = "0.2"

[lib]
name = "libxslt"
